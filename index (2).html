<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">منتا</title>
  <meta name="description" content="" id="seo-desc">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>منتا</h1></header>
  
  <main>
    <section id="about"><h2>درباره ما</h2><p id="about-text"></p></section>
    
    <section id="downloads">
      <h2>ابزارهای قابل دانلود</h2>
      <div id="downloads-list"></div>
    </section>
  </main>

  <script>
    fetch('content.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('page-title').innerText = data.siteTitle;
        document.getElementById('seo-desc').content = data.seoDescription;
        document.getElementById('about-text').innerText = data.aboutText;

        const list = document.getElementById('downloads-list');
        list.innerHTML = data.downloads.map(d => `
          <div class="tool">
            <h3>${d.name}</h3>
            <p>${d.desc}</p>
            <a href="files/${d.file}" class="download-btn" download>دانلود</a>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
